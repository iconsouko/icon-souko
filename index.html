<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイコン倉庫さん</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F6D5A">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3EEE4;
    --surface: #FFFFFF;
    --ink: #3A352F;
    --ink-soft: #6B6259;
    --accent: #4F6D5A;
    --accent-dark: #3B5445;
    --tag: #C98A3A;
    --border: #E3DACB;
    --error: #B4544A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 15%, rgba(79,109,90,0.05), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(201,138,58,0.06), transparent 40%);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 48px 40px 40px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 0 var(--border), 0 20px 40px -20px rgba(58,53,47,0.25);
    position: relative;
  }

  /* 荷札(ラベル)風のワンポイント */
  .card::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 64px;
    height: 28px;
    background: var(--tag);
    border-radius: 4px;
    box-shadow: 0 3px 8px rgba(201,138,58,0.35);
  }
  .card::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(-3deg) translateX(-20px);
    width: 6px;
    height: 6px;
    background: var(--bg);
    border: 1.5px solid var(--accent-dark);
    border-radius: 50%;
  }

  .logo-mark {
    width: 56px;
    height: 56px;
    margin: 8px auto 18px;
    display: block;
  }

  h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .tagline {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 32px;
    line-height: 1.7;
  }

  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .google-btn:hover { background: var(--accent-dark); }
  .google-btn:active { transform: scale(0.98); }
  .google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .google-btn:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }

  .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .status {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.7;
    min-height: 18px;
  }
  .status.error { color: var(--error); }
  .status.info { color: var(--ink-soft); }
  .terms-link { margin-top: 14px; }
  .terms-link a { font-size: 11.5px; color: var(--ink-soft); text-decoration: underline; }

  .welcome { display: none; }
  .welcome.show { display: block; }
  .login-area.hide { display: none; }

  .welcome p { font-size: 15px; margin: 0 0 24px; }
  .welcome strong { color: var(--accent-dark); }

  .signout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 10px 18px;
    border-radius: 10px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .signout-btn:hover { background: var(--bg); }

  @media (prefers-reduced-motion: reduce) {
    .google-btn { transition: none; }
  }

  .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: var(--ink-soft); font-size: 11.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .toggle-mode { background: none; border: none; color: var(--accent-dark); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 6px; }

  .email-form { display: none; text-align: left; }
  .email-form.show { display: block; }
  .email-form .field { margin-bottom: 12px; }
  .email-form label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; }
  .email-form input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 15px; background: var(--bg);
  }
  .email-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .email-submit-btn {
    width: 100%; padding: 13px 18px; background: var(--accent); color: #fff; border: none;
    border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 15px;
    font-weight: 500; cursor: pointer; margin-top: 4px;
  }
  .email-submit-btn:hover { background: var(--accent-dark); }
  .email-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .form-switch-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; flex-wrap: wrap; gap: 6px; }
  .form-switch-row button { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 4px; }
  .email-form-instruction { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 14px; }
  .google-btn.secondary-btn { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .google-btn.secondary-btn:hover { background: var(--bg); }
</style>
</head>
<body>

  <div class="card">
    <svg class="logo-mark" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="20" width="40" height="28" rx="3" fill="#F3EEE4" stroke="#4F6D5A" stroke-width="2.5"/>
      <path d="M6 20L28 8L50 20" stroke="#4F6D5A" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
      <line x1="8" y1="28" x2="48" y2="28" stroke="#4F6D5A" stroke-width="2"/>
      <circle cx="28" cy="36" r="3.2" fill="#C98A3A"/>
    </svg>

    <div class="login-area" id="loginArea">
      <h1>アイコン倉庫さん</h1>
      <p class="tagline">もらったアイコン、つくったアイコン。<br>ひとつひとつ、大切にしまっておこう。</p>

      <button class="google-btn" id="loginBtn">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 35.5 24 35.5c-6.4 0-11.6-5.2-11.6-11.6S17.6 12.3 24 12.3c3 0 5.6 1.1 7.7 3l5.7-5.7C34 6.4 29.3 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c10.4 0 19-8.5 19-19 0-1.4-.2-2.7-.4-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12.3 24 12.3c3 0 5.6 1.1 7.7 3l5.7-5.7C34 6.4 29.3 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/>
          <path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-1.8 13.5-4.7l-6.2-5.3c-2 1.4-4.6 2.2-7.3 2.2-5.3 0-9.7-3.5-11.3-8.4l-6.5 5C9.5 39 16.2 43.5 24 43.5z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.4-4.2 5.9l6.2 5.3C40.7 36.6 43.5 30.8 43.5 24c0-1.4-.2-2.7-.4-3.5z"/>
        </svg>
        Googleでログイン
      </button>

      <div class="divider">または</div>

      <button class="google-btn secondary-btn" id="showEmailFormBtn">メールアドレスで利用する</button>

      <div class="email-form" id="emailForm">
        <p class="email-form-instruction" id="emailFormInstruction"></p>
        <div class="field">
          <label for="emailInput">メールアドレス</label>
          <input type="email" id="emailInput" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field" id="passwordField">
          <label for="passwordInput">パスワード(8文字以上)</label>
          <input type="password" id="passwordInput" autocomplete="current-password" placeholder="半角英数字8文字以上">
        </div>
        <button class="email-submit-btn" id="emailSubmitBtn">ログイン</button>
        <div class="form-switch-row">
          <button type="button" id="toggleSignupModeBtn">アカウントをお持ちでない方はこちら</button>
          <button type="button" id="forgotPasswordBtn">パスワードをお忘れですか?</button>
          <button type="button" id="backToLoginBtn" style="display:none;">← ログイン画面に戻る</button>
        </div>
      </div>

      <p class="status" id="statusMsg"></p>
      <p class="terms-link"><a href="terms.html">利用規約</a></p>
    </div>

    <div class="welcome" id="welcomeArea">
      <h1>ログインしました</h1>
      <p>ギャラリーへ移動しています…</p>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    onAuthStateChanged, signOut, getAdditionalUserInfo,
    createUserWithEmailAndPassword, signInWithEmailAndPassword,
    sendEmailVerification, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhv01yHGyeRysg82Hr0pZPNSUpezDxU-k",
    authDomain: "icon-souko-b2471.firebaseapp.com",
    projectId: "icon-souko-b2471",
    storageBucket: "icon-souko-b2471.firebasestorage.app",
    messagingSenderId: "638657050327",
    appId: "1:638657050327:web:9b1f5ac8345c6064326292"
  };

  const app = initializeApp(firebaseConfig);

  // Firebase App Check: 正規のアプリ画面から送られたリクエストであることを証明する仕組み。
  // botや、apiKeyだけを盗んだ外部からの直接アクセスを、Firestore/Storageの手前でブロックする。
  // サイトキーは、reCAPTCHA v3の管理画面(https://www.google.com/recaptcha/admin)で
  // このサイトのドメインを登録すると発行される。
  initializeAppCheck(app, {
    provider: new ReCaptchaEnterpriseProvider("6LfyXKEtAAAAAMKwdQENo1aEUxJf-svx1y6ntJ3T"),
    isTokenAutoRefreshEnabled: true
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginBtn = document.getElementById("loginBtn");
  const statusMsg = document.getElementById("statusMsg");
  const loginArea = document.getElementById("loginArea");
  const welcomeArea = document.getElementById("welcomeArea");

  function setStatus(msg, type) {
    statusMsg.textContent = msg || "";
    statusMsg.className = "status" + (type ? " " + type : "");
  }

  if (new URLSearchParams(window.location.search).get("blocked") === "1") {
    setStatus("このアカウントは現在ご利用いただけません。お問い合わせフォームよりご連絡ください。", "error");
  }
  if (new URLSearchParams(window.location.search).get("unverified") === "1") {
    setStatus("メールアドレスの確認が完了していません。届いた確認メール内のリンクを開いてから、もう一度ログインしてください。", "error");
  }

  // 新規登録の受付状況を確認する(Google/メールどちらの新規登録でも共通で使う)
  async function checkSignupGate() {
    const signupSnap = await getDoc(doc(db, "config", "signup"));
    const cfg = signupSnap.exists() ? signupSnap.data() : { isOpen: true, maxUsers: 0, currentUserCount: 0 };
    const isFull = typeof cfg.maxUsers === "number" && typeof cfg.currentUserCount === "number"
      ? cfg.currentUserCount >= cfg.maxUsers
      : false;
    if (cfg.isOpen === false || isFull) {
      return { allowed: false, message: cfg.closedMessage || "現在、新規登録の受付を停止しています。" };
    }
    return { allowed: true };
  }

  async function performGoogleLogin(isRetry) {
    try {
      suppressAuthUI = true;
      const result = await signInWithPopup(auth, provider);
      const info = getAdditionalUserInfo(result);

      if (info && info.isNewUser) {
        const gate = await checkSignupGate();
        if (!gate.allowed) {
          // 受付停止中:今回作成されたアカウントを削除してサインアウトする
          const rejectedUser = auth.currentUser;
          setStatus(gate.message, "error");
          if (rejectedUser) {
            await rejectedUser.delete().catch(() => signOut(auth));
          }
          loginBtn.disabled = false;
          suppressAuthUI = false;
          return;
        }
      }

      // 利用停止アカウントでないか確認する(新規・既存いずれの場合も)
      const blockSnap = await getDoc(doc(db, "blocklist", result.user.uid));
      if (blockSnap.exists()) {
        setStatus("このアカウントは現在ご利用いただけません。お問い合わせフォームよりご連絡ください。", "error");
        await signOut(auth);
        loginBtn.disabled = false;
        suppressAuthUI = false;
        return;
      }

      // ここまで来たら、ログイン許可(既存ユーザー、または受付中の新規ユーザー)
      setStatus("", "");
      suppressAuthUI = false;
      proceedToApp(result.user);
    } catch (err) {
      console.error(err);
      // ブラウザのストレージ分離(プライバシー保護機能)により、ごくまれにGoogleログインの
      // ポップアップ処理が一時的に失敗することがある(ブラウザ・Firebase側の既知の挙動で、
      // アプリ側の設定ミスではない)。もう一度試すとほぼ解決するため、1回だけ自動で再試行する。
      const isStorageGlitch = err && typeof err.message === "string" && err.message.includes("missing initial state");
      if (isStorageGlitch && !isRetry) {
        setStatus("ログイン処理を再試行しています…", "info");
        setTimeout(() => performGoogleLogin(true), 400);
        return;
      }
      suppressAuthUI = false;
      if (isStorageGlitch) {
        setStatus("ブラウザの設定により、ログイン処理が一時的にうまく進みませんでした。お手数ですが、もう一度「Googleでログイン」を押してお試しください。改善しない場合は、プライベートブラウズ(シークレットモード)をオフにするか、Chromeなど別のブラウザでお試しください。", "error");
      } else {
        setStatus("ログインに失敗しました。もう一度お試しください。", "error");
      }
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener("click", () => {
    loginBtn.disabled = true;
    setStatus("ログイン処理中です…", "info");
    performGoogleLogin(false);
  });

  // ===== メールアドレスでのログイン/新規登録/パスワード再設定 =====
  const showEmailFormBtn = document.getElementById("showEmailFormBtn");
  const emailForm = document.getElementById("emailForm");
  const emailFormInstruction = document.getElementById("emailFormInstruction");
  const passwordField = document.getElementById("passwordField");
  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const emailSubmitBtn = document.getElementById("emailSubmitBtn");
  const toggleSignupModeBtn = document.getElementById("toggleSignupModeBtn");
  const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
  const backToLoginBtn = document.getElementById("backToLoginBtn");
  let emailFormMode = "login"; // "login" | "signup" | "reset"

  showEmailFormBtn.addEventListener("click", () => {
    emailForm.classList.toggle("show");
  });

  function setEmailFormMode(mode) {
    emailFormMode = mode;
    setStatus("", "");

    if (mode === "login") {
      emailFormInstruction.textContent = "メールアドレスとパスワードを入力してログインしてください。";
      passwordField.style.display = "block";
      passwordInput.autocomplete = "current-password";
      passwordInput.placeholder = "半角英数字8文字以上";
      emailSubmitBtn.textContent = "ログイン";
      toggleSignupModeBtn.style.display = "inline";
      toggleSignupModeBtn.textContent = "アカウントをお持ちでない方はこちら";
      forgotPasswordBtn.style.display = "inline";
      backToLoginBtn.style.display = "none";
    } else if (mode === "signup") {
      emailFormInstruction.textContent = "使用するメールアドレスと、新しく設定するパスワード(8文字以上)を入力してください。";
      passwordField.style.display = "block";
      passwordInput.autocomplete = "new-password";
      passwordInput.placeholder = "半角英数字8文字以上で設定してください";
      emailSubmitBtn.textContent = "新規登録する";
      toggleSignupModeBtn.style.display = "inline";
      toggleSignupModeBtn.textContent = "すでにアカウントをお持ちの方はこちら";
      forgotPasswordBtn.style.display = "none";
      backToLoginBtn.style.display = "none";
    } else if (mode === "reset") {
      emailFormInstruction.textContent = "登録済みのメールアドレスを入力し、下のボタンを押してください。パスワード再設定用のメールをお送りします。";
      passwordField.style.display = "none"; // パスワード再設定にはパスワード欄は不要
      emailSubmitBtn.textContent = "再設定メールを送信する";
      toggleSignupModeBtn.style.display = "none";
      forgotPasswordBtn.style.display = "none";
      backToLoginBtn.style.display = "inline";
    }
  }
  setEmailFormMode("login");

  toggleSignupModeBtn.addEventListener("click", () => {
    setEmailFormMode(emailFormMode === "signup" ? "login" : "signup");
  });
  forgotPasswordBtn.addEventListener("click", () => {
    setEmailFormMode("reset");
  });
  backToLoginBtn.addEventListener("click", () => {
    setEmailFormMode("login");
  });

  emailSubmitBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email) {
      setStatus("メールアドレスを入力してください。", "error");
      return;
    }

    // ----- パスワード再設定モード -----
    if (emailFormMode === "reset") {
      emailSubmitBtn.disabled = true;
      setStatus("送信中です…", "info");
      try {
        await sendPasswordResetEmail(auth, email);
        setStatus("パスワード再設定用のメールを送信しました。メール内のリンクを開いて新しいパスワードを設定したあと、ログイン画面に戻ってログインしてください。届かない場合は、迷惑メールフォルダもご確認ください。", "info");
      } catch (err) {
        console.error(err);
        setStatus(err && err.code === "auth/invalid-email" ? "メールアドレスの形式が正しくありません。" : "送信に失敗しました。メールアドレスをご確認のうえ、もう一度お試しください。", "error");
      }
      emailSubmitBtn.disabled = false;
      return;
    }

    if (!password) {
      setStatus("パスワードを入力してください。", "error");
      return;
    }
    if (emailFormMode === "signup" && password.length < 8) {
      setStatus("パスワードは8文字以上で設定してください。", "error");
      return;
    }

    emailSubmitBtn.disabled = true;
    setStatus(emailFormMode === "signup" ? "登録処理中です…" : "ログイン処理中です…", "info");

    try {
      suppressAuthUI = true;
      if (emailFormMode === "signup") {
        // 新規登録:先に受付状況を確認してからアカウントを作成する
        const gate = await checkSignupGate();
        if (!gate.allowed) {
          setStatus(gate.message, "error");
          emailSubmitBtn.disabled = false;
          suppressAuthUI = false;
          return;
        }

        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(cred.user);
        await ensureUserProfile(cred.user);
        await signOut(auth); // 認証メールのリンクを踏むまでは利用させない
        passwordInput.value = "";
        setEmailFormMode("login"); // 先にモードを切り替える(内部でメッセージがリセットされるため)
        setStatus("確認メールを送信しました。メール内のリンクを開いたあと、このページに戻ってログインしてください。届かない場合は、迷惑メールフォルダもご確認ください。", "info");
        suppressAuthUI = false;
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        if (!cred.user.emailVerified) {
          const unverifiedUser = cred.user;
          await signOut(auth);
          suppressAuthUI = false;
          setStatus("メールアドレスの確認が完了していません。届いた確認メール内のリンクを開いてから、もう一度ログインしてください。", "error");
          const resendBtn = document.createElement("button");
          resendBtn.textContent = "確認メールを再送する";
          resendBtn.style.cssText = "display:block; margin-top:8px; background:none; border:none; color:var(--accent-dark); text-decoration:underline; font-size:12px; cursor:pointer; padding:4px;";
          resendBtn.addEventListener("click", async () => {
            resendBtn.disabled = true;
            try {
              await sendEmailVerification(unverifiedUser);
              resendBtn.textContent = "再送しました";
            } catch (e) {
              console.error(e);
              resendBtn.textContent = "再送に失敗しました。時間をおいてお試しください";
            }
          });
          statusMsg.appendChild(resendBtn);
          emailSubmitBtn.disabled = false;
          return;
        }
        // 利用停止アカウントでないか確認する
        const blockSnap = await getDoc(doc(db, "blocklist", cred.user.uid));
        if (blockSnap.exists()) {
          setStatus("このアカウントは現在ご利用いただけません。お問い合わせフォームよりご連絡ください。", "error");
          await signOut(auth);
          emailSubmitBtn.disabled = false;
          suppressAuthUI = false;
          return;
        }
        setStatus("", "");
        suppressAuthUI = false;
        proceedToApp(cred.user);
      }
    } catch (err) {
      console.error(err);
      suppressAuthUI = false;
      let msg = "処理に失敗しました。もう一度お試しください。";
      if (err && err.code === "auth/email-already-in-use") {
        msg = "このメールアドレスは既に登録されています。ログインをお試しいただくか、Googleでご登録済みの場合はそちらをご利用ください。";
      } else if (err && err.code === "auth/invalid-email") {
        msg = "メールアドレスの形式が正しくありません。";
      } else if (err && (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential")) {
        msg = "メールアドレスまたはパスワードが正しくありません。";
      } else if (err && err.code === "auth/user-not-found") {
        msg = "このメールアドレスで登録されたアカウントが見つかりません。";
      } else if (err && err.code === "auth/too-many-requests") {
        msg = "試行回数が多すぎます。しばらくしてからもう一度お試しください。";
      }
      setStatus(msg, "error");
    }
    emailSubmitBtn.disabled = false;
  });

  // users/{uid} に、メールアドレス・表示名・登録日時・保存枚数の集計値を記録しておく(管理者ページで
  // 「どのuidが誰なのか」「何枚保存しているか」を把握するために使用。アイコンの中身は含まない)
  async function ensureUserProfile(user) {
    try {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email || "",
          displayName: user.displayName || "",
          createdAt: serverTimestamp(),
          lastLoginAt: serverTimestamp(),
          receivedIconCount: 0,
          createdIconCount: 0
        });
      } else {
        await setDoc(ref, {
          email: user.email || "",
          displayName: user.displayName || "",
          lastLoginAt: serverTimestamp()
        }, { merge: true });
      }
    } catch (err) {
      // プロフィール記録に失敗しても、ログイン自体は継続させる
      console.error("プロフィール記録に失敗:", err);
    }
  }

  // 「新規登録したがメール未確認のため一旦サインアウトする」のような、意図的に一瞬だけ
  // サインイン状態になってすぐサインアウトする処理の間、ログイン完了画面がちらつくのを防ぐフラグ
  let suppressAuthUI = false;

  function proceedToApp(user) {
    loginArea.classList.add("hide");
    welcomeArea.classList.add("show");
    ensureUserProfile(user).finally(() => { window.location.href = "gallery.html"; });
  }

  onAuthStateChanged(auth, (user) => {
    loginBtn.disabled = false;
    if (user) {
      // ログインボタン/登録フォームからの明示的な処理は、成功時にproceedToAppを自分で呼ぶため、
      // ここでは「すでにログイン済みの状態でこのページを開いた」場合だけ扱えばよい
      if (suppressAuthUI) return;
      proceedToApp(user);
    } else {
      loginArea.classList.remove("hide");
      welcomeArea.classList.remove("show");
    }
  });
</script>

</body>
