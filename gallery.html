<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイコン倉庫さん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3EEE4; --surface: #FFFFFF; --ink: #3A352F; --ink-soft: #6B6259;
    --accent: #4F6D5A; --accent-dark: #3B5445; --tag: #C98A3A; --border: #E3DACB; --error: #B4544A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'Zen Kaku Gothic New', sans-serif; color: var(--ink); min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 17px; margin: 0; }
  .menu-wrap { position: relative; }
  .menu-toggle { background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer; padding: 2px 10px; border-radius: 8px; line-height: 1; }
  .menu-toggle:hover { background: var(--bg); }
  .menu-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(58,53,47,0.18); min-width: 170px; overflow: hidden; z-index: 20;
  }
  .menu-dropdown.show { display: block; }
  .menu-dropdown a, .menu-dropdown button {
    display: block; width: 100%; text-align: left; padding: 12px 16px; font-size: 13.5px;
    color: var(--ink); background: none; border: none; cursor: pointer; text-decoration: none;
    font-family: 'Zen Kaku Gothic New', sans-serif; border-bottom: 1px solid var(--border);
  }
  .menu-dropdown a:last-child, .menu-dropdown button:last-child { border-bottom: none; }
  .menu-dropdown a:hover, .menu-dropdown button:hover { background: var(--bg); }
  .menu-dropdown button { color: var(--error); }

  .tabs { display: flex; gap: 6px; padding: 16px 20px 0; max-width: 720px; margin: 0 auto; }
  .tab-btn {
    flex: 1; padding: 10px 4px; border-radius: 10px 10px 0 0;
    border: 1px solid var(--border); border-bottom: none;
    background: #EDE6D8; color: var(--ink-soft);
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .tab-btn.active { background: var(--surface); color: var(--accent-dark); font-weight: 700; }

  main { max-width: 720px; margin: 0 auto; padding: 20px; background: var(--surface); border: 1px solid var(--border); min-height: 60vh; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .upload-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .upload-btn:hover { background: var(--accent-dark); }

  .col-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .col-toggle button { border: none; background: none; padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
  .col-toggle button.active { background: var(--surface); color: var(--accent-dark); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 12px; background: var(--bg); border-radius: 10px; border: 1px solid var(--border); }
  .filter-bar select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 16px; background: var(--surface); color: var(--ink); }
  .fav-filter { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
  .filter-count { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); }
  .period-toggle {
    background: none; border: 1px solid var(--border); color: var(--ink-soft);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .period-toggle.open { background: var(--surface); color: var(--accent-dark); }
  .period-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: -6px 0 16px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  .period-tilde { color: var(--ink-soft); font-size: 13px; }
  .period-clear { background: none; border: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; margin-left: auto; }

  .card-fab {
    position: fixed; right: 20px; bottom: 24px; z-index: 50;
    display: none;
    padding: 14px 20px;
    border: 1px solid rgba(196,120,110,0.4);
    border-radius: 999px;
    background: linear-gradient(135deg, #F6C6D3, #F3DCC0);
    color: #6B3F45;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(107,63,69,0.45);
  }
  .card-fab.show { display: block; }
  .card-fab:hover { box-shadow: 0 10px 24px -6px rgba(107,63,69,0.55); }
  .card-cta-btn:hover { opacity: 0.9; }

  .grid { display: grid; gap: 12px; }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .icon-cell { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); position: relative; }
  .icon-cell img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .icon-cell .label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(58,53,47,0.65); color: #fff; font-size: 10.5px; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-btn { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(255,255,255,0.85); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .fav-btn.is-fav { background: var(--tag); color: #fff; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,53,47,0.45); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; padding: 28px 24px; max-width: 380px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 17px; margin: 0 0 18px; }
  .field { margin-bottom: 16px; text-align: left; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type="text"], .field input[type="month"], .field input[type="file"] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 16px; background: var(--bg);
  }
  .field .hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--ink-soft); }
  .btn-cancel.btn-done {
    background: var(--accent); border: 1px solid var(--accent); color: #fff; font-weight: 500;
    animation: doneGlow 1.8s ease-in-out infinite;
  }
  @keyframes doneGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,109,90,0.45); }
    50% { box-shadow: 0 0 0 6px rgba(79,109,90,0); }
  }
  .btn-save { background: var(--accent); border: none; color: #fff; font-weight: 500; }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-error { color: var(--error); font-size: 12.5px; margin-top: 10px; }
  .modal-success { color: var(--accent-dark); font-size: 12.5px; margin-top: 6px; min-height: 16px; }

  .lightbox-box { background: var(--surface); border-radius: 16px; padding: 16px; max-width: 380px; width: 100%; text-align: center; position: relative; }
  .lightbox-close-x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(58,53,47,0.08); color: var(--ink-soft); font-size: 18px; line-height: 1; cursor: pointer; z-index: 1; display: flex; align-items: center; justify-content: center; }
  .lightbox-close-x:hover { background: rgba(58,53,47,0.16); }
  .lightbox-box img { width: 100%; max-height: 55vh; object-fit: contain; border-radius: 10px; background: var(--bg); }
  .lightbox-info { padding-top: 14px; }
  .lightbox-name { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .lightbox-meta { font-size: 12px; color: var(--ink-soft); margin: 0 0 10px; }
  .lightbox-hint { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 16px; }
  .lightbox-actions { display: flex; gap: 10px; }
  .lightbox-actions button, .lightbox-actions a { flex: 1; padding: 11px; border-radius: 10px; font-size: 13.5px; cursor: pointer; text-decoration: none; }
  .btn-delete { background: none; border: 1px solid var(--error); color: var(--error); }
  .btn-delete:hover { background: var(--error); color: #fff; }

  .celebration-overlay { display: none; position: fixed; inset: 0; background: linear-gradient(160deg, #4F6D5A, #3B5445); color: #fff; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
  .celebration-overlay.show { display: flex; }
  .celebration-card { text-align: center; max-width: 340px; }
  .celebration-card .icon-preview { width: 140px; height: 140px; border-radius: 20px; object-fit: cover; margin: 0 auto 24px; border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
  .celebration-card .big-msg { font-family: 'Zen Maru Gothic', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 8px; line-height: 1.5; }
  .celebration-card .sub-msg { font-size: 13px; opacity: 0.85; margin: 0 0 28px; }
  .celebration-card .brand { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; opacity: 0.7; margin-bottom: 20px; }
  .celebration-close { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 10px 24px; border-radius: 10px; font-size: 14px; cursor: pointer; }

  /* コレクションカードタブ */
  .card-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card-panel h2 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 14.5px; margin: 0 0 14px; color: var(--accent-dark); }
  .card-field-row { display: block; }
  .card-field-row .field { margin-bottom: 14px; }
  .card-field-row .field:last-child { margin-bottom: 0; }
  .month-select-row { display: flex; gap: 8px; }
  .month-select-row select { flex: 1; min-width: 0; }
  .count-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12.5px; color: var(--ink-soft); }
  .generate-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  .generate-btn:hover { background: var(--accent-dark); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-msg { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin-top: 10px; min-height: 16px; }
  .status-msg.error { color: var(--error); }
  .result-card { text-align: center; }
  .result-card img { width: 100%; border-radius: 14px; box-shadow: 0 10px 30px -10px rgba(58,53,47,0.3); margin-bottom: 10px; }
  .result-hint { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 14px; }
  .result-actions { display: flex; gap: 10px; }
  .result-actions button, .result-actions a { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; text-decoration: none; font-family: 'Zen Kaku Gothic New', sans-serif; white-space: nowrap; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; display: inline-block; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: none; border: 1px solid var(--border); color: var(--ink-soft); font-weight: 400; }
</style>
</head>
<body>

<header>
  <h1>🗃️ アイコン倉庫さん</h1>
  <div class="menu-wrap">
    <button class="menu-toggle" id="menuToggle" aria-label="メニュー">⋯</button>
    <div class="menu-dropdown" id="menuDropdown">
      <a href="manage.html">ライバー・タグ管理</a>
      <button id="signoutBtn">ログアウト</button>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabReceived" data-tab="received">もらったアイコン</button>
  <button class="tab-btn" id="tabCreated" data-tab="created">つくったアイコン</button>
</div>

<main>
  <!-- もらった/つくった 共通ギャラリービュー -->
  <div id="galleryView">
    <div class="toolbar">
      <button class="upload-btn" id="openUploadBtn">＋ アイコンを追加</button>
      <div class="col-toggle" id="colToggle">
        <button data-cols="2">2列</button>
        <button data-cols="3">3列</button>
        <button data-cols="4">4列</button>
      </div>
    </div>
    <div class="filter-bar">
      <select id="filterStreamer"><option value="">ライバー:すべて</option></select>
      <select id="filterTag"><option value="">タグ:すべて</option></select>
      <label class="fav-filter"><input type="checkbox" id="filterFavOnly"> お気に入りのみ</label>
      <button class="period-toggle" id="periodToggle">期間を指定する ▾</button>
      <span class="filter-count" id="filterCount"></span>
    </div>
    <div class="period-row" id="periodRow" style="display:none;">
      <div class="month-select-row">
        <select id="galFromYear"><option value="">開始:年</option></select>
        <select id="galFromMonth"><option value="">月</option></select>
      </div>
      <span class="period-tilde">〜</span>
      <div class="month-select-row">
        <select id="galToYear"><option value="">終了:年</option></select>
        <select id="galToMonth"><option value="">月</option></select>
      </div>
      <button class="period-clear" id="periodClearBtn">クリア</button>
    </div>
    <div class="grid cols-2" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <p id="emptyStateText"></p>
    </div>
  </div>

  <!-- コレクションカード作成モーダル -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal" style="max-width:420px;">
      <h2>カードをつくる</h2>
      <p class="count-badge" id="cardCountBadge" style="margin-bottom:16px;">対象:0枚</p>
      <div class="field">
        <label for="cardTitleInput">カードのタイトル</label>
        <input type="text" id="cardTitleInput" placeholder="タイトルを入力(空欄でも可)">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cardModalCancelBtn">もどる</button>
        <button class="btn-save" id="cardGenerateBtn">カードをつくる</button>
      </div>
      <p class="status-msg" id="cardStatusMsg"></p>

      <div class="result-card" id="cardResultPanel" style="display:none; margin-top:20px;">
        <img id="cardResultImg" alt="コレクションカード">
        <p class="result-hint">画像を長押ししても保存できます</p>
        <div class="result-actions">
          <a class="btn-primary" id="cardDownloadBtn" download="icon-souko-collection-card.png">画像を保存</a>
          <button class="btn-secondary" id="cardShareBtn" style="display:none;">共有する</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- アップロードモーダル -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2 id="modalTitle">アイコンを追加</h2>
    <div class="field">
      <label for="fileInput">画像ファイル</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="field">
      <label for="streamerInput" id="streamerLabel">ライバー名</label>
      <input type="text" id="streamerInput" list="streamerList" placeholder="例:れいかさん">
      <datalist id="streamerList"></datalist>
    </div>
    <div class="field">
      <label for="tagInput">配布理由タグ(カンマ区切りで複数入力可)</label>
      <input type="text" id="tagInput" list="tagList" placeholder="例:毎月, 誕生日記念">
      <datalist id="tagList"></datalist>
      <div class="hint">「毎月」「誕生日記念」など、あとで絞り込みに使えます</div>
    </div>
    <div class="field">
      <label for="monthInputYear" id="monthLabel">受け取った月</label>
      <div class="month-select-row">
        <select id="monthInputYear"><option value="">年</option></select>
        <select id="monthInputMonth"><option value="">月</option></select>
      </div>
    </div>
    <div class="modal-error" id="modalError"></div>
    <p class="modal-success" id="modalSuccess"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelUploadBtn">キャンセル</button>
      <button class="btn-save" id="saveUploadBtn">保存する</button>
    </div>
  </div>
</div>

<!-- 拡大表示(保存・編集用) -->
<div class="modal-overlay" id="lightboxModal">
  <div class="lightbox-box">
    <button class="lightbox-close-x" id="lightboxCloseBtn" aria-label="閉じる">×</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-info" id="lightboxViewMode">
      <p class="lightbox-name" id="lightboxName"></p>
      <p class="lightbox-meta" id="lightboxMeta"></p>
      <p class="lightbox-hint">画像を長押し(パソコンは右クリック)で保存できます</p>
      <div class="lightbox-actions">
        <button class="btn-cancel" id="lightboxEditBtn">編集</button>
        <button class="btn-delete" id="lightboxDeleteBtn">削除する</button>
      </div>
    </div>
    <div class="lightbox-info" id="lightboxEditMode" style="display:none;">
      <div class="field">
        <label id="editStreamerLabel">ライバー名</label>
        <input type="text" id="editStreamerInput" list="streamerList">
      </div>
      <div class="field">
        <label>配布理由タグ(カンマ区切り)</label>
        <input type="text" id="editTagInput" list="tagList">
      </div>
      <div class="modal-error" id="editError"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="editCancelBtn">キャンセル</button>
        <button class="btn-save" id="editSaveBtn">保存する</button>
      </div>
    </div>
  </div>
</div>

<!-- アップロード演出 -->
<div class="celebration-overlay" id="celebrationOverlay">
  <div class="celebration-card">
    <img class="icon-preview" id="celebrationImg" src="" alt="">
    <p class="big-msg" id="celebrationMsg"></p>
    <p class="sub-msg" id="celebrationSub"></p>
    <div class="brand">🗃️ アイコン倉庫さん</div>
    <button class="celebration-close" id="celebrationCloseBtn">とじる</button>
  </div>
</div>

<!-- カード作成フローティングボタン -->
<button class="card-fab" id="openCardModalBtn">カードをつくる</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, getDocs,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhv01yHGyeRysg82Hr0pZPNSUpezDxU-k",
    authDomain: "icon-souko-b2471.firebaseapp.com",
    projectId: "icon-souko-b2471",
    storageBucket: "icon-souko-b2471.firebasestorage.app",
    messagingSenderId: "638657050327",
    appId: "1:638657050327:web:9b1f5ac8345c6064326292"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentUser = null;

  const TAB_CONFIG = {
    received: {
      collectionName: "receivedIcons", streamerLabel: "ライバー名", streamerPlaceholder: "例:れいかさん",
      streamerRequired: true, monthLabel: "受け取った月", modalTitle: "もらったアイコンを追加",
      emptyText: "まだアイコンが登録されていません。<br>推しからもらったアイコンを、ここに集めていきましょう。",
      celebrationVerb: "さんのアイコン",
    },
    created: {
      collectionName: "createdIcons", streamerLabel: "メモ(任意・エピソードなど)", streamerPlaceholder: "例:○○コラボ配信の記念アイコン",
      streamerRequired: false, monthLabel: "作成した月", modalTitle: "つくったアイコンを追加",
      emptyText: "まだ記録がありません。<br>今まで作ってきたアイコンを、ここにアーカイブしていきましょう。",
      celebrationVerb: "つくったアイコン",
    }
  };

  let currentTab = "received";

  function renderGrid() {
    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const filterCount = document.getElementById("filterCount");
    const streamerFilter = currentTab === "received" ? document.getElementById("filterStreamer").value : "";
    const tagFilter = document.getElementById("filterTag").value;
    const favOnly = document.getElementById("filterFavOnly").checked;
    const periodFrom = getGalFromValue();
    const periodTo = getGalToValue();

    const filtered = allIcons.filter((icon) => {
      if (streamerFilter && icon.streamerName !== streamerFilter) return false;
      if (tagFilter && !(icon.reasonTags || []).includes(tagFilter)) return false;
      if (favOnly && !icon.isFavorite) return false;
      if (periodFrom && (!icon.receivedMonth || icon.receivedMonth < periodFrom)) return false;
      if (periodTo && (!icon.receivedMonth || icon.receivedMonth > periodTo)) return false;
      return true;
    });
    currentFilteredIcons = filtered;

    grid.innerHTML = "";
    if (allIcons.length === 0) {
      emptyState.style.display = "block";
      filterCount.textContent = "";
      return;
    }
    emptyState.style.display = "none";
    filterCount.textContent = `${filtered.length} / ${allIcons.length} 枚`;

    filtered.forEach((data) => {
      const cell = document.createElement("div");
      cell.className = "icon-cell";
      cell.innerHTML = `
        <img src="${data.imageUrl}" alt="${data.streamerName || ""}" loading="lazy">
        <button class="fav-btn${data.isFavorite ? " is-fav" : ""}" aria-label="お気に入り切り替え">${data.isFavorite ? "★" : "☆"}</button>

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxSize = 1000;
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.85);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function normalize(str) { return str.trim().toLowerCase(); }

  async function ensureCandidate(subcollection, label) {
    if (!label) return;
    const norm = normalize(label);
    const snap = await getDocs(collection(db, "users", currentUser.uid, subcollection));
    const exists = snap.docs.some((d) => normalize(d.data().label) === norm);
    if (!exists) {
      const newRef = doc(collection(db, "users", currentUser.uid, subcollection));
      await setDoc(newRef, { label, normalizedLabel: norm, createdAt: serverTimestamp() });
    }
  }

  // 複数ラベルをまとめて1回の通信でチェック・登録する(タグが複数あっても通信は1往復で済む)
  async function ensureCandidates(subcollection, labels) {
    const targets = [...new Set(labels.filter(Boolean))];
    if (targets.length === 0) return;
    const snap = await getDocs(collection(db, "users", currentUser.uid, subcollection));
    const existingNorm = new Set(snap.docs.map((d) => normalize(d.data().label)));
    const toAdd = targets.filter((l) => !existingNorm.has(normalize(l)));
    await Promise.all(toAdd.map((label) => {
      const newRef = doc(collection(db, "users", currentUser.uid, subcollection));
      return setDoc(newRef, { label, normalizedLabel: normalize(label), createdAt: serverTimestamp() });
    }));
  }

  function withTimeout(promise, ms, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
    ]);
  }

  document.getElementById("saveUploadBtn").addEventListener("click", async () => {
    const cfg = TAB_CONFIG[currentTab];
    const fileInput = document.getElementById("fileInput");
    const streamerName = document.getElementById("streamerInput").value.trim();
    const tagRaw = document.getElementById("tagInput").value.trim();
    const monthY = document.getElementById("monthInputYear").value;
    const monthM = document.getElementById("monthInputMonth").value;
    const receivedMonth = monthY && monthM ? `${monthY}-${monthM}` : "";
    const errorEl = document.getElementById("modalError");
    const saveBtn = document.getElementById("saveUploadBtn");
    if (!fileInput.files[0]) { errorEl.textContent = "画像ファイルを選択してください。"; return; }
    if (cfg.streamerRequired && !streamerName) { errorEl.textContent = `${cfg.streamerLabel}を入力してください。`; return; }
    errorEl.textContent = "";
    const myGeneration = uploadGeneration; // この保存処理が「今の画面」のものかどうかを後で判定するための番号
    saveBtn.disabled = true; saveBtn.textContent = "保存中…";
    try {
      const reasonTags = tagRaw ? tagRaw.split(/[,、]/).map((t) => t.trim()).filter(Boolean) : [];

      const blob = await withTimeout(resizeImage(fileInput.files[0]), 20000, "画像の処理がタイムアウトしました。");
      const newDocRef = doc(collection(db, "users", currentUser.uid, cfg.collectionName));
      const storagePath = `users/${currentUser.uid}/${cfg.collectionName}/${newDocRef.id}.jpg`;
      const storageRef = ref(storage, storagePath);
      await withTimeout(uploadBytes(storageRef, blob, { contentType: "image/jpeg" }), 25000, "画像のアップロードがタイムアウトしました。通信状況をご確認ください。");
      const imageUrl = await withTimeout(getDownloadURL(storageRef), 15000, "画像URLの取得がタイムアウトしました。");
      await withTimeout(
        setDoc(newDocRef, { imageUrl, storagePath, streamerName, reasonTags, receivedMonth, isFavorite: false, fileSize: blob.size, createdAt: serverTimestamp() }),
        15000, "データの保存がタイムアウトしました。"

      // ライバー名・タグ候補の確認は1回の通信+並列でまとめて行う(高速化)
      await Promise.all([
        currentTab === "received" && streamerName ? ensureCandidates("streamers", [streamerName]) : Promise.resolve(),
        ensureCandidates("reasonTags", reasonTags)
      ]);

      await loadIcons(); await loadTagList();

      // ここまでで裏側の保存自体は完了している。ただし、この処理が始まった後に
      // キャンセル・再オープンされていたら(世代が変わっていたら)、今の画面には一切反映しない
      if (myGeneration !== uploadGeneration) return;

      const totalCount = currentTab === "received"

      uploadSessionCount += 1;
      uploadSessionLast = { imageUrl, streamerName, totalCount, verb: cfg.celebrationVerb };

      // モーダルは閉じず、画像ファイルの選択欄だけをクリアして次の1枚に備える
      document.getElementById("fileInput").value = "";
      document.getElementById("modalSuccess").textContent = `✓ 保存しました(${uploadSessionCount}枚目)`;
      document.getElementById("cancelUploadBtn").textContent = "完了";
      document.getElementById("cancelUploadBtn").classList.add("btn-done");
      document.getElementById("saveUploadBtn").textContent = "続けて保存する";
    } catch (err) {
      console.error(err);
      if (myGeneration === uploadGeneration) {
        errorEl.textContent = err && err.message && err.message.includes("タイムアウト")
          ? err.message
          : "保存に失敗しました。もう一度お試しください。";
      }
    } finally {
      if (myGeneration === uploadGeneration) {
        saveBtn.disabled = false;
        saveBtn.textContent = uploadSessionCount > 0 ? "続けて保存する" : "保存する";
      }
    }
  });

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCoverImage(ctx, img, x, y, w, h) {
    const ir = img.width / img.height, tr = w / h;
    let sx, sy, sw, sh;
    if (ir > tr) { sh = img.height; sw = sh * tr; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / tr; sx = 0; sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const chars = text.split(""); let line = ""; const lines = [];
    for (const ch of chars) {
      const testLine = line + ch;
      if (ctx.measureText(testLine).width > maxWidth && line !== "") { lines.push(line); line = ch; }
      else line = testLine;
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineHeight));
  }

  document.getElementById("cardGenerateBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("cardStatusMsg");
    const btn = document.getElementById("cardGenerateBtn");
    const filtered = currentFilteredIcons;
    if (filtered.length === 0) return;
    btn.disabled = true;
    statusEl.className = "status-msg";
    statusEl.textContent = "カードを作成しています…";
    try {
      const MAX_SHOW = 16;
      const favorites = filtered.filter((i) => i.isFavorite);
      const rest = filtered.filter((i) => !i.isFavorite);
      const displayIcons = [...favorites, ...rest].slice(0, MAX_SHOW);
      const remainCount = filtered.length - displayIcons.length;
      const images = await Promise.all(displayIcons.map((i) => loadImageEl(i.imageUrl)));

      await document.fonts.load("700 40px 'Zen Maru Gothic'");
      await document.fonts.load("500 19px 'Zen Maru Gothic'");
      await document.fonts.load("400 19px 'Zen Kaku Gothic New'");
      await document.fonts.ready;

      const W = 720, H = 1000;
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, "#F8D2DC"); grad.addColorStop(0.55, "#F7E1D2"); grad.addColorStop(1, "#FBF2E1");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

      const glow = ctx.createRadialGradient(W * 0.5, 60, 10, W * 0.5, 60, 380);
      glow.addColorStop(0, "rgba(255,255,255,0.55)"); glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      const ROSE = "#C4786E", INK = "#6B3F45";

      ctx.strokeStyle = "rgba(196,120,110,0.5)"; ctx.lineWidth = 2;
      roundRectPath(ctx, 20, 20, W - 40, H - 40, 22); ctx.stroke();

      ctx.textAlign = "center";
      const ornamentY = 78;
      ctx.strokeStyle = "rgba(196,120,110,0.7)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W / 2 - 54, ornamentY); ctx.lineTo(W / 2 - 14, ornamentY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W / 2 + 14, ornamentY); ctx.lineTo(W / 2 + 54, ornamentY); ctx.stroke();
      ctx.fillStyle = ROSE; ctx.beginPath(); ctx.arc(W / 2, ornamentY, 3.5, 0, Math.PI * 2); ctx.fill();

      const title = document.getElementById("cardTitleInput").value.trim();
      let gridTop;
      if (title) {
        ctx.fillStyle = INK; ctx.font = "700 40px 'Zen Maru Gothic', sans-serif";
        wrapText(ctx, title, W / 2, 150, W - 120, 50);
        gridTop = 250;
      } else { gridTop = 150; }

      const cols = 4, gap = 14, panelPad = 26;
      const gridWidthArea = W - 100;
      const cellSize = (gridWidthArea - panelPad * 2 - gap * (cols - 1)) / cols;
      const rows = Math.ceil(images.length / cols);
      const panelHeight = rows * cellSize + (rows - 1) * gap + panelPad * 2;

      ctx.fillStyle = "rgba(255,255,255,0.55)";
      roundRectPath(ctx, 50, gridTop, W - 100, panelHeight, 20); ctx.fill();
      ctx.strokeStyle = "rgba(196,120,110,0.45)"; ctx.lineWidth = 1.5;
      roundRectPath(ctx, 50, gridTop, W - 100, panelHeight, 20); ctx.stroke();

      images.forEach((img, idx) => {
        const col = idx % cols, row = Math.floor(idx / cols);
        const x = 50 + panelPad + col * (cellSize + gap);
        const y = gridTop + panelPad + row * (cellSize + gap);
        ctx.save();
        roundRectPath(ctx, x, y, cellSize, cellSize, 12); ctx.clip();
        drawCoverImage(ctx, img, x, y, cellSize, cellSize);
        ctx.restore();
        ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1.5;
        roundRectPath(ctx, x, y, cellSize, cellSize, 12); ctx.stroke();
      });

      let footerY = gridTop + panelHeight + 34;
      if (remainCount > 0) {
        ctx.font = "400 19px 'Zen Kaku Gothic New', sans-serif";
        ctx.fillStyle = "rgba(107,63,69,0.75)";
        ctx.fillText(`ほか ${remainCount}枚`, W / 2, footerY);
      }

      ctx.textAlign = "right";
      ctx.font = "500 19px 'Zen Maru Gothic', sans-serif";
      ctx.fillStyle = INK;
      ctx.fillText("アイコン倉庫さん", W - 50, H - 56);

      ctx.textAlign = "center";
      const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, ".");
      ctx.font = "400 13px 'Zen Kaku Gothic New', sans-serif";
      ctx.fillStyle = "rgba(107,63,69,0.6)";
      ctx.fillText(dateStr, W / 2, H - 56);

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        document.getElementById("cardResultImg").src = url;
        document.getElementById("cardDownloadBtn").href = url;
        document.getElementById("cardResultPanel").style.display = "block";

        const shareBtn = document.getElementById("cardShareBtn");
        const file = new File([blob], "icon-souko-collection-card.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          shareBtn.style.display = "block";
          shareBtn.onclick = () => navigator.share({ files: [file], title: "アイコン倉庫さん" }).catch(() => {});
        } else { shareBtn.style.display = "none"; }

        statusEl.textContent = "";
        btn.disabled = false;
      }, "image/png");
    } catch (err) {
      console.error(err);
      statusEl.className = "status-msg error";
      statusEl.textContent = "カードの作成に失敗しました。もう一度お試しください。";
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
